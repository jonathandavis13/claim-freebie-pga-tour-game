name: Daily PGA Golf Freebie Claim

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs daily at 11:00 UTC
  workflow_dispatch:      # Allows manual trigger button from GitHub UI

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Run script
        run: python claim_freebies.py
